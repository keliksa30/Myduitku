<div class="absolute inset-0 bg-cover bg-center scale-105 blur-sm brightness-75" data-alt="A cozy, slightly blurred isometric 3D living room belonging to a cute cat. Pastel pinks, soft creams, and earthy browns. Warm sunlight filtering through a window, illuminating a scratching post and a plush cat bed. Dreamy, soft-focus aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDVD7YLOqGsXwNBEtQ3x0gt_rhmCOAax5YE6NTBHr_VpdLWBwajWjk9VxmzQGoKCTFACcpmPc4Xn82CtnDPWp3WFHCW6MiGnxyig8-QD0p0OfbLnCbCbIfThd5uK7Zuca9Al74KbJ7Gno6YAc_ph8bAvFMroHU7kVDOrMsE6rMgKm4J0BFQ8c4DoM0xlmBw0qHme-cS48kHtQQjro6JXgFy-psX8wm3lpu0yN8D07QFL-CxmybB04_uNQ')"></div>
</div>
<!-- Modal Container -->
<div class="relative z-10 w-full max-w-[400px] bg-surface rounded-[32px] p-container-padding shadow-2xl shadow-tertiary/20 flex flex-col gap-lg animate-[slideUp_0.4s_ease-out]">
<!-- Header -->
<div class="flex flex-col items-center gap-sm justify-center mb-sm">
<div class="w-14 h-14 rounded-full bg-secondary-container flex items-center justify-center shadow-[0_4px_12px_rgba(254,182,196,0.4)]">
<span class="material-symbols-outlined text-on-secondary-container text-[32px]" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<h2 class="font-display-lg-mobile text-headline-md text-tertiary text-center leading-tight">Beri Makan Kucing<br><span class="font-body-md text-on-surface-variant font-medium">(Catat Transaksi)</span></h2>
</div>
<!-- Form Container -->
<form class="flex flex-col gap-md" id="expense-form">
<!-- Category Dropdown -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-tertiary text-center">Kategori (Makanan)</label>
<div class="relative">
<select class="w-full bg-surface-container-low text-on-surface font-body-lg h-14 px-5 rounded-[24px] appearance-none outline-none focus:bg-surface-container transition-colors shadow-[inset_0_2px_4px_rgba(121,86,76,0.05)] border-none text-center text-center-last">
<option value="food">🍱 Makanan Utama (Food)</option>
<option value="treats">🐟 Camilan (Treats)</option>
<option value="toys">🧶 Mainan (Fun)</option>
<option value="health">💊 Kesehatan (Health)</option>
</select>
<div class="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
<div class="flex items-center justify-between px-md mt-unit bg-tertiary-container/30 py-2 rounded-full">
<span class="font-body-md text-[13px] text-on-tertiary-container flex items-center gap-unit"><span class="material-symbols-outlined text-[14px]">account_balance_wallet</span> Budget: Rp 500.000</span>
<span class="font-label-md text-[13px] text-primary">Sisa: Rp 100.000</span>
</div>
</div>
<!-- Description Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-tertiary text-center">Keterangan</label>
<input class="w-full bg-surface-container-low text-on-surface font-body-lg h-14 px-5 rounded-[24px] outline-none focus:bg-surface-container transition-colors shadow-[inset_0_2px_4px_rgba(121,86,76,0.05)] placeholder-outline-variant text-center" placeholder="Misal: Beli whiskas..." type="text">

<span class="font-headline-md text-tertiary select-none mr-sm">Rp</span>
<input class="bg-transparent text-on-surface font-headline-md outline-none placeholder-outline-variant w-full max-w-[150px] text-left" placeholder="0" type="number">

<button class="mt-sm w-full h-16 bg-secondary-container hover:bg-secondary-fixed-dim text-on-secondary-container font-headline-sm rounded-[24px] flex items-center justify-center gap-sm shadow-[0_6px_16px_rgba(254,182,196,0.5)] active:translate-y-1 active:shadow-[0_2px_8px_rgba(254,182,196,0.5)] transition-all duration-200" onclick="submitExpense()" type="button">

</div>
<style>
  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(20px) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }
  
  /* Remove number input arrows */
  input[type=number]::-webkit-inner-spin-button, 
  input[type=number]::-webkit-outer-spin-button { 
    -webkit-appearance: none; 
    margin: 0; 
  }
  
  .text-center-last {
    text-align-last: center;
  }
</style>
<script>
  function submitExpense() {
    const btn = document.querySelector('button[type="button"]');
    const originalText = btn.innerHTML;
    
    // Add simple feeding animation feedback
    btn.innerHTML = `<span class="material-symbols-outlined text-[24px] animate-bounce" style="font-variation-settings: 'FILL' 1;">favorite</span> Nyam Nyam...`;
    btn.classList.add('bg-primary-container', 'text-on-primary-container');
    btn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
    
    // Create floating hearts
    for(let i=0; i<3; i++) {
        setTimeout(() => {
            const heart = document.createElement('span');
            heart.className = 'material-symbols-outlined absolute text-secondary-container text-2xl z-50 pointer-events-none';
            heart.style.fontVariationSettings = "'FILL' 1";
            heart.innerText = 'favorite';
            
            // Random start position near the button
            const btnRect = btn.getBoundingClientRect();
            const startX = btnRect.left + (btnRect.width / 2) + (Math.random() * 40 - 20);
            const startY = btnRect.top;
            
            heart.style.left = `${startX}px`;
            heart.style.top = `${startY}px`;
            
            // Animate up and fade out
            heart.animate([
                { transform: 'translateY(0) scale(1)', opacity: 1 },
                { transform: `translateY(-60px) scale(1.5) translateX(${Math.random() * 40 - 20}px)`, opacity: 0 }
            ], {
                duration: 1000 + Math.random() * 500,
                easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
            });
            
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1500);
        }, i * 150);
    }
    
    setTimeout(() => {
      // Typically this would close the modal or redirect
      btn.innerHTML = `<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">check_circle</span> Kucing Senang!`;
      
      setTimeout(() => {
          // Reset for demo purposes
          btn.innerHTML = originalText;
          btn.classList.remove('bg-primary-container', 'text-on-primary-container');
          btn.classList.add('bg-secondary-container', 'text-on-secondary-container');
      }, 1500);
    }, 1200);
  }
</script></main></body></html>
